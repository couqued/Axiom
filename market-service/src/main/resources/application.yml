server:
  port: 8081

spring:
  application:
    name: market-service
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/axiom?currentSchema=market
    username: ${DB_USERNAME:axiom}
    password: ${DB_PASSWORD:axiom1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: market

kis:
  real:
    base-url: https://openapi.koreainvestment.com:9443
    app-key: ${KIS_REAL_APP_KEY:PLACEHOLDER}
    app-secret: ${KIS_REAL_APP_SECRET:PLACEHOLDER}
    account-no: ${KIS_REAL_ACCOUNT_NO:PLACEHOLDER}

candle:
  default-days: 60 # 기본 조회 일수

services:
  portfolio:
    url: ${PORTFOLIO_SERVICE_URL:http://portfolio-service:8083}

watchlist:
  rebalance:
    dry-run: ${WATCHLIST_DRY_RUN:true}
    liquidity:
      remove-threshold-krw: 5000000000   # 50억 (제거)
      restore-threshold-krw: 10000000000  # 100억 (복귀)
    market-cap:
      remove-threshold-krw: 500000000000   # 5000억 (제거)
      restore-threshold-krw: 600000000000  # 6000억 (복귀, 20% 버퍼)

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:PLACEHOLDER}
  enabled: ${SLACK_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health, info
