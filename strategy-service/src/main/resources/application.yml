server:
  port: 8084

spring:
  application:
    name: strategy-service
  config:
    import: optional:classpath:application-secret.yml
  jackson:
    serialization:
      write-dates-as-timestamps: false
  task:
    scheduling:
      pool:
        size: 3
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/axiom?currentSchema=strategy
    username: ${DB_USERNAME:axiom}
    password: ${DB_PASSWORD:axiom1234}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: strategy

strategy:
  # watch-tickers: 기동 시 market-service /internal/screened-tickers 에서 동적 로드 (stock-universe.json)
  candle-days: 90      # 지표 계산용 캔들 개수 (ML 최소 80 필요)
  position-sizing:
    invest-amount-krw: 500000   # 1회 매수 금액(원). 수량 = floor(금액 / 현재가)
    max-positions: 4            # 동시에 보유할 수 있는 최대 종목 수 (초과 시 BUY 스킵)
  enabled-strategies:  # 전체 등록 (시장 상태에 따라 런타임에 필터링)
    - golden-cross       # 상승장 — 스윙 (며칠~몇 주)
    - volatility-breakout # 상승장 — 당일 매매
    - rsi-bollinger      # 횡보장 — 단기~스윙 (1~5일)
    - ml-prediction      # XGBoost 예측 — 모든 시장 상태
  market-filter:
    enabled: true        # false 시 모든 전략 항상 실행
    index-code: "0001"   # 코스피
    ma-period: 20        # 20일 이평선
  trailing-stop:
    enabled: true
    stop-percent: 7.0    # 고점 대비 7% 하락 시 청산
  time-cut:
    enabled: true
    max-holding-days: 3  # 3거래일 미반등 시 강제 청산
    applicable-strategies:
      - rsi-bollinger

trading:
  holidays:
    - "2026-01-01"   # 신정
    - "2026-02-16"   # 설날 연휴 (전날)
    - "2026-02-17"   # 설날
    - "2026-02-18"   # 설날 연휴 (다음날)
    - "2026-03-02"   # 3.1절 대체공휴일 (3/1 일요일)
    - "2026-05-05"   # 어린이날
    - "2026-05-25"   # 부처님오신날 (KRX 공고 확인 필요)
    - "2026-06-03"   # 지방선거
    - "2026-08-17"   # 광복절 대체공휴일 (8/15 토요일)
    - "2026-09-24"   # 추석 연휴 (KRX 공고 확인 필요)
    - "2026-09-25"   # 추석 (KRX 공고 확인 필요)
    - "2026-09-26"   # 추석 연휴 (KRX 공고 확인 필요)
    - "2026-10-05"   # 개천절 대체공휴일 (10/3 토요일)
    - "2026-10-09"   # 한글날
    - "2026-12-25"   # 크리스마스
    - "2026-12-31"   # KRX 연말 휴장
  late-open-days:    # 10:00 늦은 개장일 (수능 등) — 09:00~09:55 스케줄러 스킵
    - "2026-11-19"   # 대학수학능력시험

market-service:
  url: ${MARKET_SERVICE_URL:http://localhost:8081}

order-service:
  url: ${ORDER_SERVICE_URL:http://localhost:8082}

portfolio-service:
  url: ${PORTFOLIO_SERVICE_URL:http://localhost:8083}

ml-service:
  url: ${ML_SERVICE_URL:http://localhost:8085}

ml-prediction:
  entry-timing:
    enabled: true
    minute-candle-count: 10
    max-defer-count: 3
    short-mult:
      min-candles: 5
    session-mult:
      below-open: 1.10
      mild:       1.00
      moderate:   0.85
      elevated:   0.60
      near-high-drop: true
    gap-mult:
      normal:  1.00
      mild:    0.90
      large:   0.70
      extreme: 0.50
    guards:
      gap-up:
        enabled: true
        gap-pct: 2.0
        until:   "09:15"
      fomo:
        enabled: true
        pct-from-open: 2.0
        until:         "10:30"

slack:
  webhook-url: ${SLACK_WEBHOOK_URL:PLACEHOLDER}   # application-secret.yml 또는 env var로 오버라이드
  enabled: ${SLACK_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health, info
