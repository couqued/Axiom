apiVersion: batch/v1
kind: CronJob
metadata:
  name: ml-training-job
  namespace: axiom
spec:
  schedule: "0 7 * * 5"        # 매주 금요일 07:00 UTC = 16:00 KST (장 마감 후)
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: train-trigger
              image: curlimages/curl:latest
              command:
                - curl
                - -X
                - POST
                - http://ml-service:8085/train
                - --fail
                - --silent
                - --show-error
