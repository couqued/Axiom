apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-service-models
  namespace: axiom
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: axiom
spec:
  replicas: 1
  strategy:
    type: Recreate      # 단일 PVC 공유 → 롤링 업데이트 불가
  selector:
    matchLabels:
      app: ml-service
  template:
    metadata:
      labels:
        app: ml-service
    spec:
      containers:
        - name: ml-service
          image: axiom/ml-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: MARKET_SERVICE_URL
              value: http://market-service:8081
            - name: MODEL_DIR
              value: /app/models
          volumeMounts:
            - name: models
              mountPath: /app/models
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ml-service-models
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: axiom
spec:
  selector:
    app: ml-service
  ports:
    - port: 8085
      targetPort: 8085
