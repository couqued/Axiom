apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-token
  namespace: axiom
type: Opaque
stringData:
  token: "eyJhIjoiOGQ3ZjE1MDI2MzMyODg5ZjE3ODVkYzU2MmU4MTliMTMiLCJ0IjoiMWRjODJkOGYtNGRjMi00OTgwLTk4ZDQtMmY5ZjEyZTlhOWFhIiwicyI6Ik1qSmlOamt5TWpRdE1tRmlaQzAwTkRFMUxUZzBORE10WXpsbFpHTTFNekUwWW1WayJ9"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: axiom
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args: ["tunnel", "--no-autoupdate", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      restartPolicy: Always
